[pytest]
# Runs on Windows with no ROS 2 installed: only pure-Python core modules are imported.
# Tests that need ROS skip themselves with pytest.importorskip (they run on the Jetson).
testpaths = ros2_ws/src tools web
addopts = --import-mode=importlib -q
norecursedirs = build install log .venv __pycache__ yolo_practice
