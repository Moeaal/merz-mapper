# LIDAR scan-matching odometry (decisions #10, #14: no wheel encoders).
rf2o_laser_odometry:
  ros__parameters:
    laser_scan_topic: /scan
    odom_topic: /odom_rf2o
    publish_tf: false            # the EKF alone owns odom->base_link
    base_frame_id: base_link
    odom_frame_id: odom
    init_pose_from_topic: ''     # no ground truth pose on this rover
    freq: 20.0                   # above the 10 Hz scan rate, so no scan waits long

scan_odom_relay:
  ros__parameters:
    # rf2o publishes no covariance, so these are the EKF's only knowledge of its quality.
    # TODO: measure on rover. Compare against a laser-measured straight run; values below are starting guesses.
    vx_std: 0.05       # m/s
    vy_std: 0.05       # m/s. The rover cannot move sideways; this measurement just holds vy near 0.
    vyaw_std: 0.1      # rad/s
    # Sanity limits, above anything the rover should reach (0.5 m/s spec). TODO: measure on rover.
    max_speed: 1.5     # m/s
    max_yaw_rate: 3.0  # rad/s
