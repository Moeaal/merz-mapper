# Keep-out zones for glass (OPEN_ISSUES #4). Only used when a mask is given to navigation.launch.py.
filter_mask_server:
  ros__parameters:
    topic_name: /keepout_filter_mask
    frame_id: map
    # yaml_filename comes from the launch argument.

costmap_filter_info_server:
  ros__parameters:
    type: 0                     # 0 = keep-out
    filter_info_topic: /costmap_filter_info
    mask_topic: /keepout_filter_mask
    base: 0.0
    multiplier: 1.0
