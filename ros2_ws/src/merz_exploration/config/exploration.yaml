# explore_lite values are the package's stock ones except where a comment says otherwise (RESEARCH_INDEX [N9]).
explore_node:
  ros__parameters:
    robot_base_frame: base_link
    return_to_init: false          # stays where it ends: a returning robot is a second run through the corridors
    costmap_topic: map
    costmap_updates_topic: map_updates
    visualize: true                # mission_node watches explore/frontiers, so this must stay on
    planner_frequency: 0.15
    progress_timeout: 30.0
    potential_scale: 3.0
    orientation_scale: 0.0
    gain_scale: 1.0
    transform_tolerance: 0.3
    min_frontier_size: 0.75        # TODO: measure on rover (smaller finds narrow gaps but chases noise near glass)

mission_node:
  ros__parameters:
    max_duration_s: 1800.0         # TODO: measure on rover (limit by real battery runtime)
    no_frontier_timeout_s: 60.0
    startup_grace_s: 30.0

access_zone_node:
  ros__parameters:
    landmark_adjacency_m: 0.5      # doors and signs sit on walls. TODO: measure on rover (wall thickness in the map)
    junction_adjacency_m: 0.5

junction_photo_node:
  ros__parameters:
    map_frame: map
    base_frame: base_link
    open_range_m: 3.0              # TODO: measure on rover (must exceed the real corridor width)
    min_open_sectors: 3
    min_spacing_m: 3.0             # TODO: measure on rover (shorter than the real distance between junctions)
    laser_yaw_rad: 0.0             # must match laser yaw in merz_description/config/sensor_poses.yaml
